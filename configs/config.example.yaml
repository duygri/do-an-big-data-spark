input:
  path: data/raw/nyc_taxi/yellow_tripdata_*.csv
  format: csv
  schema: yellow_taxi
  header: true
  zone_lookup_path: data/raw/nyc_taxi/taxi+_zone_lookup.csv

paths:
  raw: data/raw
  bronze: data/bronze/raw
  silver: data/silver/cleaned
  gold: data/gold
  processed_taxi: data/gold/taxi_trips
  reports: reports/generated

spark:
  app_name: big-data-spark-pipeline
  master: local[*]
  session_timezone: America/New_York
  max_partition_bytes: 134217728
